<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Azazel Streaming</title>
    <!-- Google Fonts: Kanit -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --primary: #1db954;
            --primary-hover: #1ed760;
            --bg-main: #121212;
            --bg-card: #1e1e1e;
            --bg-item: #282828;
            --bg-input: #2a2a2a;
            --text-main: #ffffff;
            --text-sub: #b3b3b3;
            --danger: #ff5555;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Kanit', sans-serif;
        }

        body {
            background-color: var(--bg-main);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 540px;
            background: var(--bg-card);
            padding: 32px;
            border-radius: 20px;
            box-shadow: 0 12px 32px rgba(0, 0, 0, 0.7);
            border: 1px solid #2a2a2a;
        }

        .brand-title {
            color: var(--primary);
            margin-bottom: 24px;
            font-size: 32px;
            font-weight: 600;
            text-align: center;
            letter-spacing: 0.5px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        h2, h3 {
            margin-bottom: 18px;
            font-size: 20px;
            font-weight: 500;
            color: var(--text-main);
        }

        .form-group {
            margin-bottom: 16px;
            text-align: left;
        }

        label {
            display: block;
            font-size: 13px;
            color: var(--text-sub);
            margin-bottom: 6px;
        }

        input[type="text"], input[type="url"], input[type="email"], input[type="password"], select {
            width: 100%;
            padding: 12px 16px;
            border-radius: 10px;
            border: 1px solid #383838;
            background: var(--bg-input);
            color: #fff;
            font-size: 14px;
            outline: none;
            transition: all 0.2s ease;
        }

        select option {
            background: var(--bg-card);
            color: #fff;
        }

        input:focus, select:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 2px rgba(29, 185, 84, 0.2);
        }

        .btn-group {
            display: flex;
            gap: 10px;
            margin-top: 12px;
        }

        button {
            width: 100%;
            padding: 12px 20px;
            background-color: var(--primary);
            border: none;
            color: #000000;
            font-size: 15px;
            font-weight: 600;
            border-radius: 30px;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
        }

        button:hover {
            background-color: var(--primary-hover);
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(29, 185, 84, 0.3);
        }

        .btn-secondary {
            background-color: #333333;
            color: var(--text-main);
        }

        .btn-secondary:hover {
            background-color: #444444;
            box-shadow: 0 4px 12px rgba(255, 255, 255, 0.1);
        }

        .hidden {
            display: none !important;
        }

        .user-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--bg-item);
            padding: 12px 18px;
            border-radius: 12px;
            margin-bottom: 24px;
            font-size: 14px;
            border: 1px solid #333;
        }

        .user-bar .logout-btn {
            color: var(--danger);
            text-decoration: none;
            font-weight: 500;
            padding: 4px 8px;
            border-radius: 6px;
            transition: 0.2s;
        }

        .user-bar .logout-btn:hover {
            background: rgba(255, 85, 85, 0.1);
        }

        /* ส่วน Search และ Filter Controls */
        .filter-box {
            display: flex;
            gap: 10px;
            margin-bottom: 16px;
        }

        .filter-box input {
            flex: 2;
        }

        .filter-box select {
            flex: 1;
        }

        .media-item {
            background: var(--bg-item);
            margin-top: 14px;
            padding: 16px;
            border-radius: 12px;
            text-align: left;
            border: 1px solid #333;
            transition: transform 0.2s;
        }

        .media-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 10px;
        }

        .media-info h4 {
            color: var(--text-main);
            font-size: 16px;
            font-weight: 500;
        }

        .media-info .meta {
            font-size: 12px;
            color: var(--text-sub);
            display: flex;
            gap: 8px;
            align-items: center;
            margin-top: 4px;
        }

        .category-badge {
            background: rgba(29, 185, 84, 0.15);
            color: var(--primary);
            padding: 2px 8px;
            border-radius: 12px;
            font-size: 11px;
            font-weight: 500;
            border: 1px solid rgba(29, 185, 84, 0.3);
        }

        .btn-delete {
            background: transparent;
            color: var(--text-sub);
            width: auto;
            padding: 6px;
            border-radius: 50%;
        }

        .btn-delete:hover {
            color: var(--danger);
            background: rgba(255, 85, 85, 0.1);
            box-shadow: none;
        }

        audio {
            width: 100%;
            height: 40px;
            margin-top: 6px;
            border-radius: 8px;
        }

        hr {
            border: 0;
            height: 1px;
            background: #2a2a2a;
            margin: 28px 0;
        }

        .empty-state {
            text-align: center;
            color: var(--text-sub);
            padding: 24px 0;
            font-size: 14px;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1 class="brand-title">🎵 Azazel</h1>

        <!-- ส่วนล็อกอิน / สมัครสมาชิก -->
        <div id="auth-section">
            <h2>เข้าสู่ระบบ / สมัครสมาชิก</h2>
            <div class="form-group">
                <label for="email">อีเมล</label>
                <input type="email" id="email" placeholder="example@email.com" required>
            </div>
            <div class="form-group">
                <label for="password">รหัสผ่าน</label>
                <input type="password" id="password" placeholder="••••••••" required>
            </div>
            <div class="btn-group">
                <button onclick="login()">เข้าสู่ระบบ</button>
                <button onclick="register()" class="btn-secondary">สมัครสมาชิก</button>
            </div>
        </div>

        <!-- ส่วนสตรีมมิ่ง & เพิ่มรายการสื่อ -->
        <div id="app-section" class="hidden">
            <div class="user-bar">
                <span>👤 <strong id="user-email"></strong></span>
                <a href="#" onclick="logout()" class="logout-btn">ออกจากระบบ</a>
            </div>

            <h3>เพิ่มเพลง / สื่อใหม่</h3>
            <div class="form-group">
                <label>ชื่อเพลง / หัวข้อ</label>
                <input type="text" id="media-title" placeholder="เช่น Song Title - Artist">
            </div>
            <div class="form-group">
                <label>หมวดหมู่</label>
                <select id="media-category">
                    <option value="General">ทั่วไป (General)</option>
                    <option value="Pop">Pop</option>
                    <option value="Rock">Rock</option>
                    <option value="Hip-Hop">Hip-Hop / Rap</option>
                    <option value="Lo-Fi">Lo-Fi / Chill</option>
                    <option value="Podcast">Podcast / รายการ</option>
                </select>
            </div>
            <div class="form-group">
                <label>URL ของไฟล์เสียง (MP3, WAV)</label>
                <input type="url" id="media-url" placeholder="https://example.com/audio.mp3">
            </div>
            <button onclick="addMedia()">+ เพิ่มเข้าเพลย์ลิสต์</button>

            <hr>

            <h3>รายการเพลงทั้งหมด</h3>
            
            <!-- ส่วนค้นหาและกรองข้อมูล -->
            <div class="filter-box">
                <input type="text" id="search-input" placeholder="🔍 ค้นหาชื่อเพลง..." oninput="filterMedia()">
                <select id="filter-category" onchange="filterMedia()">
                    <option value="ALL">ทุกหมวดหมู่</option>
                    <option value="General">ทั่วไป</option>
                    <option value="Pop">Pop</option>
                    <option value="Rock">Rock</option>
                    <option value="Hip-Hop">Hip-Hop</option>
                    <option value="Lo-Fi">Lo-Fi</option>
                    <option value="Podcast">Podcast</option>
                </select>
            </div>

            <div id="media-list">
                <div class="empty-state">กำลังโหลดรายการ...</div>
            </div>
        </div>
    </div>

    <!-- Firebase SDK (v10.8.0) -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { 
            getAuth, 
            signInWithEmailAndPassword, 
            createUserWithEmailAndPassword, 
            onAuthStateChanged, 
            signOut 
        } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { 
            getFirestore, 
            collection, 
            addDoc, 
            deleteDoc,
            doc,
            onSnapshot, 
            query, 
            orderBy 
        } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDk2QZh_xA-AfCk9vs1t8gKUaXqK1b9DQ4",
            authDomain: "azazel-th.firebaseapp.com",
            projectId: "azazel-th",
            storageBucket: "azazel-th.firebasestorage.app",
            messagingSenderId: "910701725182",
            appId: "1:910701725182:web:63b98cffee1688ddc12caf",
            measurementId: "G-ZEVWPTNNJG"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        let currentUser = null;
        let allMediaData = []; // เก็บ Master Data สำหรับใช้ค้นหาและกรอง client-side

        // ตรวจสอบสถานะผู้ใช้ Real-time
        onAuthStateChanged(auth, (user) => {
            currentUser = user;
            if (user) {
                document.getElementById('auth-section').classList.add('hidden');
                document.getElementById('app-section').classList.remove('hidden');
                document.getElementById('user-email').innerText = user.email;
                loadMedia();
            } else {
                document.getElementById('auth-section').classList.remove('hidden');
                document.getElementById('app-section').classList.add('hidden');
            }
        });

        function getThaiErrorMessage(errorCode) {
            switch (errorCode) {
                case 'auth/invalid-email': return 'รูปแบบอีเมลไม่ถูกต้อง';
                case 'auth/user-not-found': return 'ไม่พบผู้ใช้นี้ในระบบ';
                case 'auth/wrong-password': return 'รหัสผ่านไม่ถูกต้อง';
                case 'auth/email-already-in-use': return 'อีเมลนี้ถูกใช้งานแล้ว';
                case 'auth/weak-password': return 'รหัสผ่านต้องมีความยาวอย่างน้อย 6 ตัวอักษร';
                default: return 'เกิดข้อผิดพลาด กรุณาลองใหม่อีกครั้ง';
            }
        }

        window.register = async () => {
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value.trim();
            if(!email || !password) return alert('กรุณากรอกอีเมลและรหัสผ่าน');

            try {
                await createUserWithEmailAndPassword(auth, email, password);
                alert('สมัครสมาชิกสำเร็จ!');
            } catch (err) {
                alert(getThaiErrorMessage(err.code));
            }
        };

        window.login = async () => {
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value.trim();
            if(!email || !password) return alert('กรุณากรอกอีเมลและรหัสผ่าน');

            try {
                await signInWithEmailAndPassword(auth, email, password);
            } catch (err) {
                alert(getThaiErrorMessage(err.code));
            }
        };

        window.logout = () => signOut(auth);

        // เพิ่มข้อมูลสื่อพร้อมหมวดหมู่
        window.addMedia = async () => {
            const titleInput = document.getElementById('media-title');
            const categoryInput = document.getElementById('media-category');
            const urlInput = document.getElementById('media-url');
            
            const title = titleInput.value.trim();
            const category = categoryInput.value;
            const url = urlInput.value.trim();

            if (!title || !url) return alert('กรุณากรอกชื่อและลิงก์สื่อ');

            try {
                await addDoc(collection(db, "media"), {
                    title: title,
                    category: category,
                    url: url,
                    userId: currentUser.uid,
                    userEmail: currentUser.email,
                    createdAt: new Date()
                });
                titleInput.value = '';
                urlInput.value = '';
            } catch (err) {
                alert("ไม่สามารถเพิ่มสื่อได้: " + err.message);
            }
        };

        window.deleteMedia = async (docId) => {
            if (confirm('คุณต้องการลบเพลงนี้ใช่หรือไม่?')) {
                try {
                    await deleteDoc(doc(db, "media", docId));
                } catch (err) {
                    alert("เกิดข้อผิดพลาดในการลบ: " + err.message);
                }
            }
        };

        // ดึงรายการสื่อ Real-time
        function loadMedia() {
            const q = query(collection(db, "media"), orderBy("createdAt", "desc"));
            
            onSnapshot(q, (snapshot) => {
                allMediaData = [];
                snapshot.forEach((docSnap) => {
                    allMediaData.push({
                        id: docSnap.id,
                        ...docSnap.data()
                    });
                });
                renderMediaList(allMediaData);
            });
        }

        // ระบบกรองข้อมูลด้วย Search Text และ Category Select
        window.filterMedia = () => {
            const searchText = document.getElementById('search-input').value.toLowerCase().trim();
            const selectedCategory = document.getElementById('filter-category').value;

            const filteredData = allMediaData.filter(item => {
                const matchesSearch = item.title.toLowerCase().includes(searchText) || 
                                     (item.userEmail && item.userEmail.toLowerCase().includes(searchText));
                const matchesCategory = (selectedCategory === 'ALL') || (item.category === selectedCategory);

                return matchesSearch && matchesCategory;
            });

            renderMediaList(filteredData);
        };

        // Render รายการเพลงลงบน DOM
        function renderMediaList(items) {
            const mediaList = document.getElementById('media-list');
            mediaList.innerHTML = '';

            if (items.length === 0) {
                mediaList.innerHTML = '<div class="empty-state">ไม่พบรายการเพลงที่ค้นหา</div>';
                return;
            }

            items.forEach((data) => {
                const item = document.createElement('div');
                item.className = 'media-item';
                
                const isOwner = currentUser && (data.userId === currentUser.uid);
                const categoryName = data.category || 'General';

                item.innerHTML = `
                    <div class="media-header">
                        <div class="media-info">
                            <h4>${escapeHtml(data.title)}</h4>
                            <div class="meta">
                                <span class="category-badge">${escapeHtml(categoryName)}</span>
                                <span>โดย: ${escapeHtml(data.userEmail || 'ไม่ทราบชื่อ')}</span>
                            </div>
                        </div>
                        ${isOwner ? `<button class="btn-delete" onclick="deleteMedia('${data.id}')" title="ลบรายการ">🗑️</button>` : ''}
                    </div>
                    <audio controls controlsList="nodownload" src="${escapeHtml(data.url)}"></audio>
                `;
                mediaList.appendChild(item);
            });
        }

        function escapeHtml(text) {
            if (!text) return '';
            return text
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");
        }
    </script>
</body>
</html>
