<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Azazel Streaming</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: #121212;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            width: 100%;
            max-width: 480px;
            background: #1e1e1e;
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.6);
        }
        h1 {
            color: #1db954;
            margin-bottom: 24px;
            font-size: 28px;
            text-align: center;
        }
        h2, h3 {
            margin-bottom: 16px;
            font-size: 18px;
            color: #ddd;
        }
        .form-group {
            margin-bottom: 14px;
            text-align: left;
        }
        label {
            display: block;
            font-size: 12px;
            color: #aaa;
            margin-bottom: 6px;
        }
        input[type="text"], input[type="url"], input[type="email"], input[type="password"] {
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid #333;
            background: #2a2a2a;
            color: #fff;
            font-size: 14px;
            outline: none;
            transition: 0.2s;
        }
        input:focus {
            border-color: #1db954;
        }
        button {
            width: 100%;
            padding: 12px;
            background-color: #1db954;
            border: none;
            color: #ffffff;
            font-size: 15px;
            font-weight: bold;
            border-radius: 25px;
            cursor: pointer;
            margin-top: 10px;
            transition: 0.2s;
        }
        button:hover {
            background-color: #1ed760;
            transform: scale(1.02);
        }
        .btn-secondary {
            background-color: #333333;
            margin-top: 8px;
        }
        .btn-secondary:hover {
            background-color: #444444;
        }
        .hidden {
            display: none;
        }
        .user-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #282828;
            padding: 10px 16px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-size: 14px;
        }
        .user-bar a {
            color: #ff5555;
            text-decoration: none;
            font-weight: bold;
        }
        .media-item {
            background: #282828;
            margin-top: 12px;
            padding: 16px;
            border-radius: 10px;
            text-align: left;
        }
        .media-item h4 {
            color: #fff;
            margin-bottom: 8px;
            font-size: 15px;
        }
        audio {
            width: 100%;
            height: 36px;
            margin-top: 6px;
        }
        hr {
            border: 0;
            height: 1px;
            background: #333;
            margin: 24px 0;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Azazel Streaming</h1>

        <!-- ส่วนล็อกอิน / สมัครสมาชิก -->
        <div id="auth-section">
            <h2>เข้าสู่ระบบ / สมัครสมาชิก</h2>
            <div class="form-group">
                <label>อีเมล</label>
                <input type="email" id="email" placeholder="example@email.com">
            </div>
            <div class="form-group">
                <label>รหัสผ่าน</label>
                <input type="password" id="password" placeholder="••••••••">
            </div>
            <button onclick="login()">เข้าสู่ระบบ</button>
            <button onclick="register()" class="btn-secondary">สมัครสมาชิก</button>
        </div>

        <!-- ส่วนสตรีมมิ่ง & เพิ่มรายการสื่อ -->
        <div id="app-section" class="hidden">
            <div class="user-bar">
                <span>👤 <span id="user-email"></span></span>
                <a href="#" onclick="logout()">ออกจากระบบ</a>
            </div>

            <h3>เพิ่มเพลง / สื่อใหม่</h3>
            <div class="form-group">
                <input type="text" id="media-title" placeholder="ชื่อเพลง / สื่อ">
            </div>
            <div class="form-group">
                <input type="url" id="media-url" placeholder="วางลิงก์ไฟล์เสียง (เช่น MP3 URL)">
            </div>
            <button onclick="addMedia()">เพิ่มเข้าเพลย์ลิสต์</button>

            <hr>

            <h3>รายการสื่อทั้งหมด</h3>
            <div id="media-list"></div>
        </div>
    </div>

    <!-- Firebase SDK (v10.8.0) -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getFirestore, collection, addDoc, onSnapshot, query, orderBy } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        // คอนฟิก Firebase ของคุณ
        const firebaseConfig = {
            apiKey: "AIzaSyDk2QZh_xA-AfCk9vs1t8gKUaXqK1b9DQ4",
            authDomain: "azazel-th.firebaseapp.com",
            projectId: "azazel-th",
            storageBucket: "azazel-th.firebasestorage.app",
            messagingSenderId: "910701725182",
            appId: "1:910701725182:web:63b98cffee1688ddc12caf",
            measurementId: "G-ZEVWPTNNJG"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        // ตรวจสอบสถานะผู้ใช้
        onAuthStateChanged(auth, (user) => {
            if (user) {
                document.getElementById('auth-section').classList.add('hidden');
                document.getElementById('app-section').classList.remove('hidden');
                document.getElementById('user-email').innerText = user.email;
                loadMedia();
            } else {
                document.getElementById('auth-section').classList.remove('hidden');
                document.getElementById('app-section').classList.add('hidden');
            }
        });

        // สมัครสมาชิก
        window.register = () => {
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            if(!email || !password) return alert('กรุณากรอกอีเมลและรหัสผ่าน');
            createUserWithEmailAndPassword(auth, email, password)
                .then(() => alert('สมัครสมาชิกสำเร็จ!'))
                .catch(err => alert('เกิดข้อผิดพลาด: ' + err.message));
        };

        // เข้าสู่ระบบ
        window.login = () => {
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            if(!email || !password) return alert('กรุณากรอกอีเมลและรหัสผ่าน');
            signInWithEmailAndPassword(auth, email, password)
                .catch(err => alert('เข้าสู่ระบบไม่สำเร็จ: ' + err.message));
        };

        // ออกจากระบบ
        window.logout = () => signOut(auth);

        // เพิ่มข้อมูลสื่อ
        window.addMedia = async () => {
            const title = document.getElementById('media-title').value;
            const url = document.getElementById('media-url').value;

            if (!title || !url) return alert('กรุณากรอกชื่อและลิงก์สื่อ');

            try {
                await addDoc(collection(db, "media"), {
                    title: title,
                    url: url,
                    createdAt: new Date()
                });
                document.getElementById('media-title').value = '';
                document.getElementById('media-url').value = '';
            } catch (err) {
                alert("เกิดข้อผิดพลาด: " + err.message);
            }
        };

        // ดึงรายการเพลง Real-time
        function loadMedia() {
            const q = query(collection(db, "media"), orderBy("createdAt", "desc"));
            onSnapshot(q, (snapshot) => {
                const mediaList = document.getElementById('media-list');
                mediaList.innerHTML = '';
                snapshot.forEach((doc) => {
                    const data = doc.data();
                    const item = document.createElement('div');
                    item.className = 'media-item';
                    item.innerHTML = `<h4>${data.title}</h4><audio controls src="${data.url}"></audio>`;
                    mediaList.appendChild(item);
                });
            });
        }
    </script>
</body>
</html>
